<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Магазин</title>
        <link rel="stylesheet" href="style.css" />
        <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
        <script type="module" src="src/main.js"></script>
    </head>
    <body>
        <header>
            <h1>Магазин</h1>
        </header>
        <main>
            <section id="catalog-section">
                <h2>Каталог</h2>
                <ul id="catalog-list"></ul>
            </section>
            <section id="cart-section">
                <h2>Корзина</h2>
                <span>Корзина пуста</span>
                <ul id="cart-list">
                    <li>
                        <div>
                            <span>Название товара</span>
                            <button type="button" aria-label="Убрать один">
                                -
                            </button>
                            <span>0</span>
                            <button type="button" aria-label="Добавить один">
                                +
                            </button>
                            <button type="button" aria-label="Удалить">
                                ×
                            </button>
                        </div>
                        <div>
                            <span>0</span> ₽ × <span> 0</span> шт =
                            <span>0</span> ₽
                        </div>
                    </li>
                </ul>
                <div>
                    <span>Итого</span>
                    <span>0</span> ₽
                </div>
                <button type="button" id="order-start-button">
                    Оформить заказ
                </button>
            </section>
        </main>
        <div id="cart-scroll">
            <button type="button" id="cart-scroll-button">
                <img
                    src="assets/basket.svg"
                    alt="Перейти к корзине"
                    style="height: 1rem"
                />
            </button>
        </div>
        <div id="message-modal" class="modal">
            <div class="modal-container">
                <h2>Сообщение</h2>
                <button
                    id="message-close-button"
                    class="modal-close"
                    type="button"
                    aria-label="Закрыть"
                >
                    ×
                </button>
                <p id="message-text">Заказ создан!</p>
            </div>
        </div>
        <div id="order-modal" class="modal">
            <div class="modal-container">
                <h2>Оформление заказа</h2>
                <button
                    id="order-close-button"
                    class="modal-close"
                    type="button"
                    aria-label="Закрыть"
                >
                    ×
                </button>
                <form id="order-form">
                    <div>
                        <label for="first-name">Имя</label>
                        <input
                            id="first-name"
                            name="first-name"
                            type="text"
                            placeholder="Иван"
                            required
                        />
                    </div>
                    <div>
                        <label for="second-name">Фамилия</label>
                        <input
                            id="second-name"
                            name="second-name"
                            type="text"
                            placeholder="Иванов"
                            required
                        />
                    </div>
                    <div>
                        <label for="address">Адрес доставки</label>
                        <input
                            id="address"
                            name="address"
                            type="text"
                            placeholder="Санкт-Петербург"
                            required
                        />
                    </div>
                    <div>
                        <label for="phone">Контактный номер телефона</label>
                        <input
                            id="phone"
                            name="phone"
                            type="tel"
                            placeholder="+7 (999) 123-45-67"
                            required
                        />
                    </div>
                    <button type="submit">Создать заказ</button>
                </form>
            </div>
        </div>
    </body>
</html>
